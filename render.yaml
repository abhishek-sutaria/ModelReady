# ModelReady — one public web service (UI + API on the same URL)
services:
  - type: web
    name: modelready
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Render injects PORT for routing; keep this aligned with the container listen port.
      - key: PORT
        value: "8080"
      - key: CORS_ORIGINS
        value: "*"
      - key: STATIC_DIR
        value: /app/backend/static
